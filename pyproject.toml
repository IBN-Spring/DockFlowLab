[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockflowlab"
version = "2.2.0"
description = "DockFlowLab - 面向非专业用户的跨平台分子对接桌面工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [{ name = "DockFlowLab contributors" }]
keywords = ["molecular docking", "autodock vina", "cheminformatics", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# 运行 GUI 所需的轻量依赖。化学计算重依赖见 [full]。
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28",
    "psutil>=5.9",
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
# 完整的化学计算后端：配体制备、受体制备、结构修复
chem = [
    "rdkit>=2023.9",
    "meeko>=0.6",
    "openbabel-wheel>=3.1.1.19",
    "openmm>=8.0",
    "pdbfixer>=1.9",
]
# 打包/发布所需
build = [
    "pyinstaller>=6.10",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
dockflowlab-cli = "dockflowlab.cli:main"

[project.gui-scripts]
dockflowlab = "dockflowlab.app:gui_main"
dockflowlab-gui = "dockflowlab.app:gui_main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dockflowlab = [
    "resources/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 运行时间较长的集成测试",
    "network: 需要访问外网的测试",
]
