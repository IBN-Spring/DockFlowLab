<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DockFlowLab 相互作用视图</title>
<style>
  :root {
    --bg: #f7f8fa;
    --ink: #172033;
    --muted: #6b7280;
    --hbond: #2a78d6;
    --metal: #0891b2;
    --saltbridge: #7c3aed;
    --pistacking: #0e8a6e;
    --pication: #c0268a;
    --halogen: #6b7f00;
    --hydrophobic: #d97706;
    --vdw: #7c8799;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
      "Hiragino Sans GB", system-ui, sans-serif;
  }
  #viewport { position: absolute; inset: 0; }
  #leaders {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  #leaders line {
    stroke: #98a2b3;
    stroke-width: 1.15;
    stroke-linecap: round;
  }
  #leaders circle { stroke-width: 1.6; }
  /* 选中高亮画在 2D 覆盖层：3D 虚线常被残基球棍挡住，2D 金色虚线
     才能稳定可见，同时不动残基本身的显示尺寸。 */
  #selection {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  #selection line {
    stroke: #e9a13b;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 7 6;
  }
  #selection .glow {
    stroke: #ffffff;
    stroke-width: 5.5;
    stroke-dasharray: none;
    opacity: .8;
  }
  #selection circle {
    fill: #e9a13b;
    stroke: #ffffff;
    stroke-width: 1.6;
  }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .contact-label {
    --c: var(--vdw);
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border: 1px solid rgba(23, 32, 51, .10);
    border-radius: 8px;
    background: rgba(255, 255, 255, .96);
    box-shadow: 0 4px 14px rgba(23, 32, 51, .13);
    color: var(--ink);
    font-size: 12px;
    line-height: 1.2;
    white-space: nowrap;
    transform: translate(0, -50%);
    will-change: left, top;
    opacity: 0;
    transition: opacity .14s ease, border-color .14s ease, box-shadow .14s ease;
    pointer-events: auto;
    cursor: pointer;
  }
  .contact-label:hover { border-color: rgba(23, 32, 51, .28); }
  .contact-label:focus-visible {
    outline: 2px solid #e9a13b;
    outline-offset: 2px;
  }
  .contact-label.selected {
    border-color: #e9a13b;
    box-shadow:
      0 0 0 2px rgba(233, 161, 59, .26),
      0 4px 14px rgba(23, 32, 51, .14);
  }
  .contact-label.hbond { --c: var(--hbond); }
  .contact-label.metal { --c: var(--metal); }
  .contact-label.saltbridge { --c: var(--saltbridge); }
  .contact-label.pistacking { --c: var(--pistacking); }
  .contact-label.pication { --c: var(--pication); }
  .contact-label.halogen { --c: var(--halogen); }
  .contact-label.hydrophobic { --c: var(--hydrophobic); }
  .contact-label.vdw { --c: var(--vdw); }
  .contact-label.visible { opacity: 1; }
  .contact-label .dot {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--c);
  }
  .contact-label .res { font-weight: 700; }
  .contact-label .kind { color: var(--muted); }
  .contact-label .dist {
    color: #374151;
    font-variant-numeric: tabular-nums;
  }

  #legend {
    position: absolute;
    left: 14px;
    bottom: 14px;
    padding: 9px 12px;
    border: 1px solid rgba(23, 32, 51, .10);
    border-radius: 10px;
    background: rgba(255, 255, 255, .90);
    box-shadow: 0 4px 16px rgba(23, 32, 51, .08);
    color: var(--ink);
    font-size: 12px;
    line-height: 1.7;
    backdrop-filter: blur(6px);
  }
  #legend .title {
    display: block;
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  #legend .item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-right: 12px;
  }
  #legend .item[data-visible="false"] { opacity: .35; }
  #legend .item[data-present="false"] { display: none; }
  #legend .swatch {
    display: inline-block;
    width: 16px;
    height: 0;
    border-top: 2px dashed var(--c);
  }
  #legend .swatch.solid {
    height: 8px;
    border: none;
    border-radius: 50%;
  }
  #legend .meta {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
  }

  #hint {
    position: absolute;
    right: 14px;
    bottom: 16px;
    color: #7c8799;
    font-size: 12px;
    line-height: 1.5;
    text-shadow: 0 1px 2px rgba(255, 255, 255, .9);
  }

  #message {
    position: absolute;
    left: 50%;
    top: 50%;
    display: none;
    max-width: 70%;
    padding: 16px 20px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(23, 32, 51, .10);
    border-radius: 10px;
    background: rgba(255, 255, 255, .94);
    box-shadow: 0 8px 28px rgba(23, 32, 51, .10);
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
    text-align: center;
    white-space: pre-wrap;
  }
</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="ngl.js"></script>
</head>
<body>
<div id="viewport"></div>
<svg id="leaders" xmlns="http://www.w3.org/2000/svg"></svg>
<svg id="selection" xmlns="http://www.w3.org/2000/svg" style="display:none">
  <line id="selected-glow" class="glow"/>
  <line id="selected-line"/>
  <circle id="selected-start" r="4"/>
  <circle id="selected-end" r="4"/>
</svg>
<div id="labels"></div>
<div id="legend">
  <span class="title">相互作用</span>
  <span class="item" data-kind="hbond" style="--c: var(--hbond)">
    <span class="swatch"></span>氢键
  </span>
  <span class="item" data-kind="metal" style="--c: var(--metal)">
    <span class="swatch"></span>金属配位
  </span>
  <span class="item" data-kind="saltbridge" style="--c: var(--saltbridge)">
    <span class="swatch"></span>盐桥
  </span>
  <span class="item" data-kind="pistacking" style="--c: var(--pistacking)">
    <span class="swatch"></span>π-堆积
  </span>
  <span class="item" data-kind="pication" style="--c: var(--pication)">
    <span class="swatch"></span>π-阳离子
  </span>
  <span class="item" data-kind="halogen" style="--c: var(--halogen)">
    <span class="swatch"></span>卤键
  </span>
  <span class="item" data-kind="hydrophobic" style="--c: var(--hydrophobic)">
    <span class="swatch"></span>疏水作用
  </span>
  <span class="item" data-kind="vdw" style="--c: var(--vdw)">
    <span class="swatch"></span>范德华接触
  </span>
  <span class="meta">金色 = 当前选中 · 蛋白背景可在下方开启</span>
</div>
<div id="hint">点击标签定位 · 双击重置</div>
<div id="message"></div>
<script>
(function () {
  "use strict";

  // NGL.Shape 的颜色参数是 0–1 的 RGB 数组，不接受整理后的整数。
  const KIND_RGB = {
    hbond: [0.165, 0.471, 0.839],
    metal: [0.031, 0.569, 0.698],
    saltbridge: [0.486, 0.227, 0.929],
    pistacking: [0.055, 0.541, 0.431],
    pication: [0.753, 0.149, 0.541],
    halogen: [0.420, 0.498, 0.000],
    hydrophobic: [0.851, 0.467, 0.024],
    vdw: [0.486, 0.529, 0.600]
  };
  const KIND_LABELS = {
    hbond: "氢键",
    metal: "金属配位",
    saltbridge: "盐桥",
    pistacking: "π-堆积",
    pication: "π-阳离子",
    halogen: "卤键",
    hydrophobic: "疏水作用",
    vdw: "范德华接触"
  };
  const KIND_KEYS = Object.keys(KIND_LABELS);

  function kindColorCss(kind) {
    const rgb = KIND_RGB[kind] || KIND_RGB.vdw;
    return "rgb(" + Math.round(rgb[0] * 255) + "," +
      Math.round(rgb[1] * 255) + "," + Math.round(rgb[2] * 255) + ")";
  }
  const TEAL = 0x1f9d8f;
  const LIGAND_PURPLE = 0x8b5cf6;
  const PROTEIN_GRAY = 0x9daabc;

  let stage = null;
  let bridge = null;
  let structureComp = null;
  let initialOrientation = null;
  let data = null;
  let pendingData = null;
  let failed = false;
  const residueReps = {};
  const lineComponents = {};
  const visibility = {};
  KIND_KEYS.forEach(function (kind) {
    residueReps[kind] = [];
    lineComponents[kind] = null;
    visibility[kind] = true;
  });
  let labelsVisible = true;
  // 蛋白卡通默认关闭：半透明卡通在透明通道里会盖在配体上，把分子切成
  // 一段一段；交互细节视图优先保证配体与接触残基清晰可读。
  let proteinVisible = false;
  let proteinReps = [];
  let labelItems = [];
  let selectedIndex = -1;

  const SVG_NS = "http://www.w3.org/2000/svg";
  const messageEl = document.getElementById("message");
  const labelsEl = document.getElementById("labels");
  const leadersEl = document.getElementById("leaders");
  const selectionEl = document.getElementById("selection");
  const selectedGlowEl = document.getElementById("selected-glow");
  const selectedLineEl = document.getElementById("selected-line");
  const selectedStartEl = document.getElementById("selected-start");
  const selectedEndEl = document.getElementById("selected-end");
  const viewportEl = document.getElementById("viewport");
  const hintEl = document.getElementById("hint");
  const legendItems = Array.from(document.querySelectorAll("#legend .item"));

  function post(name, payload) {
    if (!bridge || typeof bridge[name] !== "function") return;
    try {
      bridge[name](JSON.stringify(payload || {}));
    } catch (err) {
      // 窗口关闭后桥接对象可能失效，忽略即可。
    }
  }

  function fail(message) {
    if (failed) return;
    failed = true;
    post("viewerFailed", { message: String(message || "未知错误") });
  }

  function showMessage(text) {
    messageEl.textContent = String(text || "");
    messageEl.style.display = text ? "block" : "none";
  }

  function hideMessage() {
    messageEl.style.display = "none";
  }

  function vec(coords) {
    return new NGL.Vector3(Number(coords[0]), Number(coords[1]), Number(coords[2]));
  }

  // ------------------------------------------------------------------
  // 场景清理与构建
  // ------------------------------------------------------------------
  function clearLabels() {
    labelItems = [];
    while (labelsEl.firstChild) labelsEl.removeChild(labelsEl.firstChild);
    while (leadersEl.firstChild) leadersEl.removeChild(leadersEl.firstChild);
  }

  function clearHighlight() {
    selectedIndex = -1;
    hideSelectionOverlay();
    labelItems.forEach(function (entry) {
      entry.element.classList.remove("selected");
    });
  }

  function selectInteraction(index) {
    if (!stage || !data || !data.interactions) return;
    const next = Number(index);
    const valid =
      Number.isInteger(next) && next >= 0 && next < data.interactions.length;
    if (!valid || next === selectedIndex) {
      clearHighlight();
      updateLabels();
      stage.viewer.requestRender();
      return;
    }

    clearHighlight();
    selectedIndex = next;
    const item = data.interactions[next];

    labelItems.forEach(function (entry) {
      entry.element.classList.toggle("selected", entry.index === next);
    });

    // 镜头移到接触中心，但保留当前观察方向。
    const mid = [
      (Number(item.proteinCoord[0]) + Number(item.ligandCoord[0])) / 2,
      (Number(item.proteinCoord[1]) + Number(item.ligandCoord[1])) / 2,
      (Number(item.proteinCoord[2]) + Number(item.ligandCoord[2])) / 2
    ];
    stage.viewerControls.center(vec(mid));
    stage.viewerControls.distance(24);
    stage.viewer.requestRender();
    updateLabels();
  }

  function clearScene() {
    if (!stage) return;
    clearHighlight();
    clearLabels();
    if (structureComp) {
      stage.removeComponent(structureComp);
      structureComp = null;
    }
    proteinReps = [];
    KIND_KEYS.forEach(function (kind) {
      residueReps[kind] = [];
    });
    Object.keys(lineComponents).forEach(function (kind) {
      if (lineComponents[kind]) {
        stage.removeComponent(lineComponents[kind]);
        lineComponents[kind] = null;
      }
    });
  }

  function kindSelection(kind) {
    if (!data || !data.interactions) return "";
    const selections = data.interactions
      .filter(function (item) { return item.kind === kind; })
      .map(function (item) { return "(" + item.selection + ")"; });
    return selections.length ? "(" + selections.join(" or ") + ") and not water" : "";
  }

  function addDashedLine(shape, start, end, color, radius) {
    const a = vec(start);
    const b = vec(end);
    const length = a.distanceTo(b);
    if (!isFinite(length) || length <= 0.01) return;
    const segments = Math.max(4, Math.round(length / 0.55));
    for (let i = 0; i < segments; i += 2) {
      const t0 = i / segments;
      const t1 = Math.min(1, (i + 0.62) / segments);
      shape.addCylinder(
        [
          a.x + (b.x - a.x) * t0,
          a.y + (b.y - a.y) * t0,
          a.z + (b.z - a.z) * t0
        ],
        [
          a.x + (b.x - a.x) * t1,
          a.y + (b.y - a.y) * t1,
          a.z + (b.z - a.z) * t1
        ],
        color,
        radius
      );
    }
  }

  function buildInteractionShape(kind) {
    if (!stage || !data) return null;
    const items = data.interactions.filter(function (item) {
      return item.kind === kind;
    });
    if (!items.length) return null;
    const shape = new NGL.Shape("interaction-" + kind, { radialSegments: 8 });
    items.forEach(function (item) {
      addDashedLine(
        shape,
        item.ligandCoord,
        item.proteinCoord,
        KIND_RGB[kind],
        0.08
      );
    });
    const component = stage.addComponentFromObject(shape);
    if (!component) return null;
    component.addRepresentation("buffer", { opacity: 0.95 });
    return component;
  }

  function buildLabel(item, index) {
    const element = document.createElement("div");
    element.className = "contact-label " + item.kind;
    element.title = "点击在 3D 中加粗对应虚线并定位";
    element.tabIndex = 0;
    const dot = document.createElement("span");
    dot.className = "dot";
    const residue = document.createElement("span");
    residue.className = "res";
    residue.textContent = item.residue;
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = "· " + (item.kindLabel || KIND_LABELS[item.kind] || "");
    const distance = document.createElement("span");
    distance.className = "dist";
    distance.textContent = Number(item.distance).toFixed(2) + " Å";
    element.appendChild(dot);
    element.appendChild(residue);
    element.appendChild(kind);
    element.appendChild(distance);

    function activate() {
      selectInteraction(index);
      post("interactionSelected", { index: selectedIndex });
    }
    element.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      activate();
    });
    element.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        activate();
      }
    });
    labelsEl.appendChild(element);

    // 引线单独画在 SVG 层：标签固定在视图两侧，用细线指向接触原子。
    const line = document.createElementNS(SVG_NS, "line");
    line.style.display = "none";
    const anchorDot = document.createElementNS(SVG_NS, "circle");
    anchorDot.setAttribute("r", "3.2");
    anchorDot.setAttribute("fill", "#ffffff");
    anchorDot.setAttribute("stroke", kindColorCss(item.kind));
    anchorDot.style.display = "none";
    leadersEl.appendChild(line);
    leadersEl.appendChild(anchorDot);

    labelItems.push({
      element: element,
      item: item,
      index: index,
      line: line,
      anchorDot: anchorDot,
      // 卡片尺寸不会随相机变化，先量一次，旋转时只更新位置。
      width: Math.max(80, element.offsetWidth || 120),
      height: Math.max(24, element.offsetHeight || 26)
    });
    return element;
  }

  function buildLigand(component) {
    if (!data || !data.ligandSelection) return;
    component.addRepresentation("ball+stick", {
      sele: data.ligandSelection,
      colorScheme: "uniform",
      colorValue: LIGAND_PURPLE,
      aspectRatio: 2.2,
      scale: 1.5,
      radius: 0.18,
      multipleBond: "symmetric"
    });
  }

  function buildResidues() {
    if (!structureComp) return;
    Object.keys(residueReps).forEach(function (kind) {
      residueReps[kind] = [];
      const selection = kindSelection(kind);
      if (!selection) return;
      // 金属离子是孤立原子，licorice 依赖成键可能什么都不画；改用球棍。
      const options = {
        sele: selection,
        colorScheme: "uniform",
        colorValue: TEAL,
        radius: 0.14,
        multipleBond: "symmetric"
      };
      const rep = structureComp.addRepresentation(
        kind === "metal" ? "ball+stick" : "licorice",
        kind === "metal"
          ? Object.assign({}, options, { radius: 0.32, scale: 1.6 })
          : options
      );
      if (rep) residueReps[kind].push(rep);
    });
  }

  function buildLabels() {
    clearLabels();
    if (!data || !data.interactions) return;
    data.interactions.forEach(function (item, index) {
      buildLabel(item, index);
    });
  }

  // 图例只为实际出现的类型留位置，避免八种颜色全列出来。
  function updateLegendPresence() {
    const counts = {};
    ((data && data.interactions) || []).forEach(function (item) {
      counts[item.kind] = (counts[item.kind] || 0) + 1;
    });
    legendItems.forEach(function (item) {
      const kind = item.getAttribute("data-kind");
      item.setAttribute("data-present", String(Boolean(counts[kind])));
    });
  }

  function applyVisibility() {
    Object.keys(residueReps).forEach(function (kind) {
      residueReps[kind].forEach(function (rep) {
        if (rep) rep.setVisibility(visibility[kind]);
      });
      if (lineComponents[kind]) {
        lineComponents[kind].setVisibility(visibility[kind]);
      }
    });
    labelItems.forEach(function (entry) {
      const visible = labelsVisible && visibility[entry.item.kind];
      entry.element.classList.toggle("visible", visible);
    });
    legendItems.forEach(function (item) {
      const kind = item.getAttribute("data-kind");
      item.setAttribute("data-visible", String(Boolean(visibility[kind])));
    });
    if (stage) stage.viewer.requestRender();
  }

  function applyProteinVisibility() {
    proteinReps.forEach(function (rep) {
      if (rep) rep.setVisibility(proteinVisible);
    });
  }

  function setProteinVisible(value) {
    proteinVisible = Boolean(value);
    applyProteinVisibility();
    if (stage) stage.viewer.requestRender();
  }

  function loadData() {
    if (!stage || !pendingData) return;
    const payload = pendingData;
    pendingData = null;
    data = payload;
    clearScene();
    initialOrientation = null;
    hideMessage();

    const pdb = String(payload.pdb || "");
    if (!pdb.trim()) {
      showMessage("复合物中没有可显示的结构。");
      return;
    }

    KIND_KEYS.forEach(function (kind) {
      visibility[kind] = true;
    });
    updateLegendPresence();
    applyVisibility();

    const blob = new Blob([pdb], { type: "text/plain" });
    stage.loadFile(blob, { ext: "pdb", defaultRepresentation: false }).then(function (component) {
      if (!component) {
        showMessage("结构加载失败：没有可显示的原子。");
        return;
      }
      structureComp = component;
      proteinReps = [];

      // 蛋白只作为空间参考。半透明卡通在 NGL 的透明通道里总是画在配体之后，
      // 即使它在配体背面也会盖住配体，看上去像分子被切断；因此默认关闭，
      // 由界面上的“蛋白背景”开关按需显示。
      const cartoonRep = component.addRepresentation("cartoon", {
        sele: "polymer",
        colorScheme: "uniform",
        colorValue: PROTEIN_GRAY,
        opacity: 0.30,
        aspectRatio: 4.5,
        subdiv: 7,
        smoothSheet: true
      });
      if (cartoonRep) proteinReps.push(cartoonRep);
      // 非聚合物靶点（如小分子、部分核酸修饰）没有卡通模型，用淡线框兜底。
      const ligandSelection = String(payload.ligandSelection || "");
      if (ligandSelection) {
        const fillerRep = component.addRepresentation("licorice", {
          sele: "not polymer and not water and not (" + ligandSelection + ")",
          colorScheme: "uniform",
          colorValue: PROTEIN_GRAY,
          opacity: 0.28,
          radius: 0.10
        });
        if (fillerRep) proteinReps.push(fillerRep);
      }
      applyProteinVisibility();

      buildLigand(component);
      buildResidues();
      buildLabels();

      KIND_KEYS.forEach(function (kind) {
        lineComponents[kind] = buildInteractionShape(kind);
      });

      // 记录一个基于完整结构的初始朝向，重置视角时复用它，避免每次重置
      // 都跳到随机角度。
      component.autoView();
      initialOrientation = stage.viewerControls.getOrientation();
      focusScene();
      applyVisibility();
      hideMessage();
      post("structureReady", {
        atoms: component.structure.atomCount,
        interactions: data.interactions ? data.interactions.length : 0
      });
    }).catch(function (error) {
      showMessage("无法显示复合物：" + String(error));
      post("viewerMessage", { message: String(error) });
    });
  }

  // ------------------------------------------------------------------
  // 相机与标签
  // ------------------------------------------------------------------
  function focusScene() {
    if (!stage || !structureComp) return;
    clearHighlight();
    const items = (data && data.interactions) || [];
    if (!items.length) {
      // 没有接触时镜头对准配体：蛋白卡通默认隐藏，框住整个蛋白只会让配体
      // 缩成一个点。
      const ligandSele = data && data.ligandSelection;
      if (ligandSele) {
        structureComp.autoView(ligandSele);
      } else {
        structureComp.autoView();
      }
      if (initialOrientation) stage.viewerControls.orient(initialOrientation);
      stage.viewer.requestRender();
      updateLabels();
      return;
    }

    const coords = [];
    items.forEach(function (item) {
      coords.push(item.ligandCoord);
      coords.push(item.proteinCoord);
    });
    let min = [Infinity, Infinity, Infinity];
    let max = [-Infinity, -Infinity, -Infinity];
    coords.forEach(function (coord) {
      for (let i = 0; i < 3; i += 1) {
        const value = Number(coord[i]);
        if (value < min[i]) min[i] = value;
        if (value > max[i]) max[i] = value;
      }
    });
    if (!isFinite(min[0])) return;
    const center = [
      (min[0] + max[0]) / 2,
      (min[1] + max[1]) / 2,
      (min[2] + max[2]) / 2
    ];
    let radius = 0;
    coords.forEach(function (coord) {
      const dx = Number(coord[0]) - center[0];
      const dy = Number(coord[1]) - center[1];
      const dz = Number(coord[2]) - center[2];
      radius = Math.max(radius, Math.sqrt(dx * dx + dy * dy + dz * dz));
    });
    radius = Math.max(radius, 5.0) + 4.0;

    if (initialOrientation) stage.viewerControls.orient(initialOrientation);
    stage.viewerControls.center(vec(center));
    const fov = stage.viewer.camera.fov * Math.PI / 180;
    const distance = Math.max(11, (radius / Math.tan(fov / 2)) * 1.22);
    stage.viewerControls.distance(distance);
    stage.viewer.requestRender();
    updateLabels();
  }

  function clamp(value, low, high) {
    const ceiling = Math.max(low, high);
    return Math.min(Math.max(value, low), ceiling);
  }

  function hideLeaders() {
    labelItems.forEach(function (entry) {
      if (entry.line) entry.line.style.display = "none";
      if (entry.anchorDot) entry.anchorDot.style.display = "none";
    });
  }

  // NGL 的 getPositionOnCanvas 返回 CSS 像素，但 y 轴原点在画布底部
  // （内部用 height - clientY），而标签用 CSS top 定位，所以这里翻转 y。
  function projectToView(coords, viewHeight) {
    const position = stage.viewerControls.getPositionOnCanvas(vec(coords));
    const x = Number(position.x);
    const y = viewHeight - Number(position.y);
    if (!isFinite(x) || !isFinite(y)) return null;
    return { x: x, y: y };
  }

  function hideSelectionOverlay() {
    selectionEl.style.display = "none";
  }

  function updateSelectionOverlay(viewHeight) {
    if (!stage || !data || !data.interactions) {
      hideSelectionOverlay();
      return;
    }
    const item = data.interactions[selectedIndex];
    if (!item || !visibility[item.kind]) {
      hideSelectionOverlay();
      return;
    }
    const a = projectToView(item.ligandCoord, viewHeight);
    const b = projectToView(item.proteinCoord, viewHeight);
    if (!a || !b) {
      hideSelectionOverlay();
      return;
    }
    // 2D 金色虚线的端点与 3D 接触虚线重合，只覆盖在画面最上层，
    // 这样无论残基怎么遮挡都能看清选中了哪条接触。
    [selectedGlowEl, selectedLineEl].forEach(function (line) {
      line.setAttribute("x1", a.x.toFixed(1));
      line.setAttribute("y1", a.y.toFixed(1));
      line.setAttribute("x2", b.x.toFixed(1));
      line.setAttribute("y2", b.y.toFixed(1));
    });
    selectedStartEl.setAttribute("cx", a.x.toFixed(1));
    selectedStartEl.setAttribute("cy", a.y.toFixed(1));
    selectedEndEl.setAttribute("cx", b.x.toFixed(1));
    selectedEndEl.setAttribute("cy", b.y.toFixed(1));
    selectionEl.style.display = "";
  }

  function layoutColumn(entries, side, viewWidth, viewHeight) {
    if (!entries.length) return;
    const margin = 14;
    const top = 16;
    // 左下角图例、右下角操作提示不能被标签压住。
    const bottom = Math.max(top + 40, viewHeight - (side === "left" ? 108 : 48));

    entries.forEach(function (entry) {
      entry.desiredY = clamp(
        entry.anchor.y,
        top + entry.height / 2,
        bottom - entry.height / 2
      );
    });
    entries.sort(function (a, b) { return a.desiredY - b.desiredY; });

    if (entries.length === 1) {
      entries[0].y = entries[0].desiredY;
    } else {
      const gap = 9;
      let maxHeight = 24;
      entries.forEach(function (entry) {
        maxHeight = Math.max(maxHeight, entry.height);
      });
      const minSpan = (maxHeight + gap) * (entries.length - 1);
      const desiredSpan =
        entries[entries.length - 1].desiredY - entries[0].desiredY;
      const maxSpan = Math.max(0, bottom - top - maxHeight);
      // 先保证互不重叠；空间足够时再让标签尽量靠近各自的锚点。
      const span = Math.max(
        0, Math.min(maxSpan, Math.max(minSpan, desiredSpan))
      );
      const startLow = top + maxHeight / 2;
      const startHigh = bottom - maxHeight / 2 - span;
      const start = clamp(entries[0].desiredY, startLow, startHigh);
      entries.forEach(function (entry, index) {
        entry.y = start + (span * index) / (entries.length - 1);
      });
    }

    entries.forEach(function (entry) {
      let x;
      if (side === "left") {
        x = margin;
        entry.leaderX = x + entry.width + 4;
      } else {
        x = Math.max(margin, viewWidth - margin - entry.width);
        entry.leaderX = x - 4;
      }
      entry.x = x;
      entry.element.style.left = x.toFixed(1) + "px";
      entry.element.style.top = entry.y.toFixed(1) + "px";
    });
  }

  function updateLabels() {
    hideLeaders();
    labelItems.forEach(function (entry) {
      entry.element.style.visibility = "hidden";
    });
    if (!stage) {
      hideSelectionOverlay();
      return;
    }

    const viewWidth = labelsEl.clientWidth;
    const viewHeight = labelsEl.clientHeight;
    if (viewWidth < 20 || viewHeight < 20) {
      hideSelectionOverlay();
      return;
    }

    // 选中高亮独立于标签开关：隐藏标签时仍保留金色虚线。
    updateSelectionOverlay(viewHeight);

    if (!labelsVisible || !labelItems.length) return;

    const entries = [];
    labelItems.forEach(function (entry) {
      const item = entry.item;
      if (!visibility[item.kind]) return;
      const anchor = projectToView(item.proteinCoord, viewHeight);
      if (!anchor) return;
      const x = anchor.x;
      const y = anchor.y;
      // 锚点转到视图外时不再画标签，避免引线贴着边缘乱跑。
      if (x < -80 || x > viewWidth + 80 || y < -80 || y > viewHeight + 80) {
        return;
      }
      entry.anchor = { x: x, y: y };
      entries.push(entry);
    });
    if (!entries.length) return;

    // 以所有锚点的水平中心分左右两列；标签固定在列上，引线负责指向。
    let sumX = 0;
    entries.forEach(function (entry) { sumX += entry.anchor.x; });
    const centerX = sumX / entries.length;
    const left = [];
    const right = [];
    entries.forEach(function (entry) {
      (entry.anchor.x < centerX ? left : right).push(entry);
    });

    layoutColumn(left, "left", viewWidth, viewHeight);
    layoutColumn(right, "right", viewWidth, viewHeight);

    entries.forEach(function (entry) {
      entry.element.style.visibility = "";
      entry.line.setAttribute("x1", entry.leaderX.toFixed(1));
      entry.line.setAttribute("y1", entry.y.toFixed(1));
      entry.line.setAttribute("x2", entry.anchor.x.toFixed(1));
      entry.line.setAttribute("y2", entry.anchor.y.toFixed(1));
      entry.anchorDot.setAttribute("cx", entry.anchor.x.toFixed(1));
      entry.anchorDot.setAttribute("cy", entry.anchor.y.toFixed(1));
      entry.line.style.display = "";
      entry.anchorDot.style.display = "";
    });
  }

  // ------------------------------------------------------------------
  // 对外接口
  // ------------------------------------------------------------------
  function setKindVisible(kind, value) {
    if (!(kind in visibility)) return;
    visibility[kind] = Boolean(value);
    applyVisibility();
    updateLabels();
  }

  function setLabelsVisible(value) {
    labelsVisible = Boolean(value);
    hintEl.textContent = labelsVisible
      ? "点击标签定位 · 双击重置"
      : "双击重置";
    applyVisibility();
    updateLabels();
  }

  function setData(payload) {
    pendingData = payload || {};
    if (stage) loadData();
  }

  function init() {
    try {
      stage = new NGL.Stage("viewport", {
        backgroundColor: "#f7f8fa",
        quality: "high",
        sampleLevel: 2,
        cameraFov: 40,
        ambientIntensity: 0.52,
        lightIntensity: 1.12,
        tooltip: false
      });
      stage.mouseControls.remove("clickPick-left");
      stage.viewer.signals.rendered.add(updateLabels);
      loadData();
      updateLabels();
      post("viewerReady", { webgl: true });
    } catch (error) {
      showMessage("3D 视图初始化失败：" + String(error));
      fail(error);
    }
  }

  function start() {
    if (typeof NGL === "undefined") {
      showMessage("NGL Viewer 未能加载（ngl.js 缺失）。");
      fail("NGL 未加载");
      return;
    }
    if (typeof QWebChannel === "undefined" || typeof qt === "undefined" ||
        !qt.webChannelTransport) {
      init();
      return;
    }
    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
      init();
    });
  }

  viewportEl.addEventListener("dblclick", function () {
    focusScene();
    post("interactionSelected", { index: -1 });
  });

  window.dflInteractions = {
    setData: setData,
    setKindVisible: setKindVisible,
    setLabelsVisible: setLabelsVisible,
    setProteinVisible: setProteinVisible,
    selectInteraction: selectInteraction,
    resetView: focusScene,
    syncSize: function () {
      if (!stage) return;
      stage.handleResize();
      stage.viewer.requestRender();
      updateLabels();
    }
  };

  window.addEventListener("resize", function () {
    if (!stage) return;
    stage.handleResize();
    stage.viewer.requestRender();
    updateLabels();
  });

  window.addEventListener("error", function (event) {
    post("viewerMessage", {
      message: String(event.message || event.error || "脚本错误")
    });
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
