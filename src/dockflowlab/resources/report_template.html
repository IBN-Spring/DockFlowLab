<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root {
    --surface: #fcfcfb;
    --panel: #ffffff;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --blue: #2a78d6;
    --blue-dark: #0d366b;
    --blue-soft: #eaf2fd;
    --red: #b3261e;
    --red-soft: #fdecea;
    --green: #1f6b3a;
    --green-soft: #e8f5ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.65;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 28px 64px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 20px; margin-bottom: 28px; }
  .eyebrow { color: var(--blue); font-size: 12px; letter-spacing: .12em; font-weight: 700; }
  h1 { font-size: 30px; line-height: 1.25; margin: 8px 0 8px; }
  .meta { color: var(--ink-secondary); margin: 0; font-size: 13px; }
  h2 { font-size: 19px; margin: 38px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--grid); }
  h3 { font-size: 15px; margin: 22px 0 8px; }
  p { margin: 8px 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 24px 0 8px; }
  .tile { background: var(--panel); border: 1px solid var(--grid); border-radius: 10px; padding: 16px 18px; }
  .tile .value { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tile .label { color: var(--ink-secondary); font-size: 12px; margin-top: 4px; }
  .tile.accent { background: var(--blue-soft); border-color: #c9defa; }
  .tile.accent .value { color: var(--blue-dark); }
  figure { margin: 20px 0 8px; background: var(--panel); border: 1px solid var(--grid); border-radius: 10px; padding: 12px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 6px; }
  figcaption { color: var(--ink-secondary); font-size: 12px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink-secondary); font-weight: 600; font-size: 12px; background: #f6f6f3; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { border: 1px solid var(--grid); border-radius: 10px; overflow: hidden; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .badge.ok { background: var(--green-soft); color: var(--green); }
  .badge.fail { background: var(--red-soft); color: var(--red); }
  .badge.skip { background: #f1f0ec; color: var(--ink-secondary); }
  .empty { color: var(--ink-secondary); background: var(--panel); border: 1px dashed var(--baseline); border-radius: 10px; padding: 18px; }
  .method-list { margin: 0; display: grid; grid-template-columns: 150px 1fr; gap: 6px 16px; }
  .method-list dt { color: var(--ink-secondary); }
  .method-list dd { margin: 0; }
  .note { background: var(--panel); border-left: 3px solid var(--baseline); padding: 12px 16px; border-radius: 0 8px 8px 0; }
  .note.warn { border-left-color: #c98a00; background: #fff9e9; }
  .note ul { margin: 6px 0 0; padding-left: 20px; }
  .note li { margin: 4px 0; }
  footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--ink-muted); font-size: 12px; }
  code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; background: #f2f1ed; padding: 1px 5px; border-radius: 4px; }
  @media print {
    body { background: #fff; }
    main { max-width: none; padding: 0; }
    h2 { break-after: avoid; }
    figure, .table-wrap, .note { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">DockFlowLab · 分子对接工作台</div>
    <h1>$title</h1>
    <p class="meta">项目：$project &nbsp;·&nbsp; 生成时间：$generated</p>
  </header>

  <section class="tiles">$tiles</section>
  $charts
  <section>
    <h2>结果总览</h2>
    $results
  </section>
  <section>
    <h2>构象评分明细</h2>
    $poses
  </section>
  $redocking
  $trust
  <section>
    <h2>计算方法与参数</h2>
    <dl class="method-list">$methods</dl>
  </section>
  <section>
    <h2>注意事项与局限</h2>
    $warnings
  </section>

  <footer>
    DockFlowLab $version · 本报告由程序自动生成。对接评分为计算预测，需结合实验或文献证据判断。
  </footer>
</main>
</body>
</html>
